# PlanaLyrics -- 歌词覆盖层配置
# 改完保存即自动生效，不需要重启。
#
# 颜色格式为 #RRGGBBAA，最后两位是不透明度：FF=完全不透明，00=全透明。
#
# 这个文件是项目自带的默认设置：首次运行会复制到 ~/.config/PlanaLyrics/，
# 右键菜单里的「恢复默认设置」也用它覆盖当前设置。

[player]
# 留空 = 自动跟随正在播放的来源（音乐播放器、浏览器都支持）
# 想固定在某个来源上，就填它的名字 —— 右键菜单「播放器」里能看到可用的名字
pin = ""
lxmusic_port = 23330       # LX Music 的“开放 API”端口（需在 LX Music 设置里打开）
poll_ms = 500              # 向播放器查询播放位置的间隔（毫秒），中间会自行插值

[window]
# 窗口位置：默认放在左上角，换一台不同分辨率的屏幕也不会跑到可视范围之外。
# 鼠标拖动只影响本次运行；想固定当前位置，用右键菜单「窗口 → 保存窗口大小和位置」。
x = 0
y = 0
type_hint = "normal"        # normal / utility / dock / notification
show_in_taskbar = true      # true = 出现在左侧坞栏里（也能从应用程序列表启动）
all_workspaces = true       # true = 在所有工作区（页面）都显示，翻页时歌词不会消失

# 面板：固定尺寸，中间透明，只有最外层一圈描边
# 下面的宽高是每次启动时的大小；拖边缘调整只影响本次运行，
# 想把某个尺寸和位置定下来，用右键菜单「窗口 → 保存窗口大小和位置」。
panel_width = 512
panel_height = 256
min_panel_width = 320      # 拖动缩放时的最小尺寸
min_panel_height = 120
corner_radius = 14
border_width = 2
border_color = "#FFFFFF8C"
glow_size = 10             # 描边外侧的柔和光晕宽度（像素），0 = 关闭
glow_color = "#00000059"   # 深色=外阴影（浅色壁纸下边界更清楚）；白色则像发光

# 歌词排版（字号与窗口大小无关，用右键菜单「窗口 → 增大/减小字号」调整）
anchor_ratio = 0.5         # 当前句在面板里的垂直位置：0=顶部 1=底部
context_lines = 1          # 当前句前后各显示几句
context_opacity = 0.2     # 前后那几句的不透明度（淡到背景里，不抢当前句）
context_scale = 0.75       # 前后那几句的字号比例（切句时会平滑放大/缩小）
blur_px = 5                # 前后那几句的模糊半径（像素）：0=不模糊，越大越糊
karaoke = true             # 当前句按时间从左到右“唱到哪亮到哪”
# 下面三项是「逐字进度」的逐字时间来源，按书写顺序优先取用；
# 三项都取不到（或全都关掉）时，退回按整句平均时间推进。
karaoke_awlrc = true       # 歌词自带的 awlrc 逐字轴（AMLL/Lyricify 格式）
karaoke_online = true      # 联网取逐字歌词：先网易云（yrc），没有再试酷狗（krc）；与上面的联网搜歌词开关无关
karaoke_enhanced = true    # 行内 <mm:ss.xx> 的增强型 LRC
unsung_opacity = 0.35      # 还没唱到的部分的亮度（相对已唱部分），0 = 完全看不见
karaoke_tail = 0.88        # 扫描在“距下一句还有多少比例”时结束：1 = 一直扫到下一句
karaoke_max_ms = 6000      # 单句扫描的最长毫秒数，间隔很长时不会慢慢扫一整天
karaoke_lift = 4           # 已唱到的字比未唱的高出多少像素；0 = 只变颜色不抬高
karaoke_lift_span = 1.4    # 抬起一个字要花几个字的宽度：1=就在这个字内抬完，越大相邻的字越会被带着动
font_family = "Noto Sans CJK SC"
font_weight = "black"      # thin/light/normal/medium/semibold/bold/heavy/black
font_lyrics = 34           # 当前句字号（font_scale=100 时；前后句按 context_scale 缩小）
font_translation = 23      # 译文行（font_scale=100 时）
font_scale = 100           # 字号缩放百分比（34~166）：右键菜单「窗口 → 增大/减小字号」改这个
line_spacing = 24          # 相邻两句之间的间距
inner_spacing = 3          # 一句歌词与它自己的译文之间的间距
padding = 28               # 文字与面板左右边缘的距离
edge_fade = 14             # 面板上下边缘的文字渐隐高度

# 文字：深色壁纸下用这套
color_current = "#FFFFFFFF"    # 当前句
color_lyrics = "#FFFFFFFF"     # 其他句（再乘以上面的不透明度）
color_translation = "#FFFFFFA6"
halo_radius = 0                # 0 = 纯色字，不加描边
halo_color = "#000000"         # halo_radius > 0 时才生效
halo_alpha = 0.9

# 文字：浅色壁纸下用这套（近黑字 + 中灰译文 + 白色描边）
adapt_to_background = true     # 按面板背后壁纸的明暗自动切换以上两套
light_color_current = "#0A0A0AFF"
light_color_lyrics = "#0A0A0AFF"
light_color_translation = "#5A6270FF"
light_halo_color = "#FFFFFF"

animation_ms = 500         # 滚动到下一句所需时间；0 = 直接跳转
show_translation = true    # 非中英文的歌曲（日语、韩语等）显示中文译文

[lyrics]
music_dirs = []            # 本地音乐目录，用于在播放器不给文件路径时反查
cache_dir = ""
online_enabled = true      # 联网搜索歌词与译文：关掉后不再联网找歌词（逐字歌词另有开关）
search_translation = true  # 非中英文歌曲自己不带中文时，联网补一条中文译文
offset_ms = 0              # 歌词整体微调，负数=提前
